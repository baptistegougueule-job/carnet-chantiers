<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carnet de chantiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: carnet d'atelier — barre d'onglets en haut, contenu en une colonne large, groupes empilés comme des fiches */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunk:#E7EAE4; --fg:#1B2320; --muted:#5B6863; --line:#D5DAD3;
  --accent:#C07F12; --accent-ink:#7B4F06; --accent-soft:#F5EAD3; --on-accent:#FFFFFF;
  --ok:#2E7A4C; --ok-soft:#DDEFE3; --warn:#B4511A; --warn-soft:#F7E2D5; --info:#2C6787; --info-soft:#DCEAF2; --idle:#6E6A86; --idle-soft:#E6E4EF;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A18; --surface:#1C2421; --sunk:#111614; --fg:#E5EAE7; --muted:#98A5A0; --line:#2D3833;
  --accent:#E3A640; --accent-ink:#F2CB82; --accent-soft:#3A2D14; --on-accent:#1B1406;
  --ok:#62C08A; --ok-soft:#1E3627; --warn:#EB8D58; --warn-soft:#3D2418; --info:#6DB2D6; --info-soft:#1A2F3B; --idle:#ADA8CC; --idle-soft:#2A2838;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1C2421; --sunk:#111614; --fg:#E5EAE7; --muted:#98A5A0; --line:#2D3833;
  --accent:#E3A640; --accent-ink:#F2CB82; --accent-soft:#3A2D14; --on-accent:#1B1406;
  --ok:#62C08A; --ok-soft:#1E3627; --warn:#EB8D58; --warn-soft:#3D2418; --info:#6DB2D6; --info-soft:#1A2F3B; --idle:#ADA8CC; --idle-soft:#2A2838;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;font-weight:800;font-stretch:115%;letter-spacing:-.01em}
.brand .date{color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:8px 12px 10px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-stretch:95%;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:.75rem;margin-left:4px;color:var(--muted)}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:.92rem}
.banner.err{background:var(--warn-soft);color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .left{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
select.sm,input.sm{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:.9rem;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface)}
.btn:hover{filter:brightness(.97)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group>h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;font-size:1rem;font-weight:700;font-stretch:105%;border-bottom:1px solid var(--line);background:linear-gradient(var(--sunk),var(--sunk)) left/4px 100% no-repeat}
.group>h3 .sub{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0}
.row .title{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.row .title:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.row.done .title{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.link{cursor:pointer;border:0}
.chip.dur{background:var(--info-soft);color:var(--info);font-weight:600;font-family:var(--f-mono);font-size:.74rem}
.chip.late{background:var(--warn-soft);color:var(--warn);font-weight:600}
.check{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;margin:1px 0 0;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}

.pill{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.st-devis{background:var(--idle-soft);color:var(--idle)} .st-planifie{background:var(--info-soft);color:var(--info)}
.st-encours{background:var(--accent-soft);color:var(--accent-ink)} .st-attente{background:var(--warn-soft);color:var(--warn)}
.st-termine{background:var(--ok-soft);color:var(--ok)}
[class*=" st-x"]{background:var(--idle-soft);color:var(--idle)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card h3{font-size:1.08rem;font-weight:700;font-stretch:105%}
.card .line{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .small{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--ok)}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.kv b{color:var(--fg);font-weight:600}

.phead{display:flex;flex-direction:column;gap:8px}
.back{align-self:flex-start}
.phead h2{font-size:1.7rem;font-weight:800;font-stretch:110%}
.phead .kv{font-size:.93rem}
.sections{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h3{font-size:1.15rem;font-weight:700;font-stretch:108%}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--sunk);border-top:1px solid var(--line)}
.quick input,.quick select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;font-size:.9rem}
.quick .grow{flex:1 1 160px}
.quick .qty{width:64px} .quick .unit{width:70px} .quick .price{width:84px}
.quick button{padding:7px 12px;border-radius:6px;border:0;background:var(--fg);color:var(--bg);font-weight:600;cursor:pointer}
.tbl-wrap{overflow-x:auto}
.total{display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--line);font-size:.9rem}
.total b{font-family:var(--f-mono)}
.qtycol{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap;min-width:64px}
.price{font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}

.loc{display:inline-block;width:.6em;height:.6em;border:2px solid currentColor;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-right:6px;vertical-align:.05em;opacity:.8}
.blines{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.blines .done-line{text-decoration:line-through;color:var(--muted)}
.muted{color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default}
.row.trajet{background:var(--sunk);padding-block:6px;font-size:.88rem}
.car{display:inline-block;width:.9em;height:.5em;border:2px solid currentColor;border-radius:3px 6px 2px 2px;margin-right:6px;vertical-align:.05em}
.newclient{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--sunk)}
.contact{display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.contact span{user-select:all;overflow-wrap:anywhere}

/* panneau latéral */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{font-size:1.2rem;font-weight:700;font-stretch:108%}
.sheet form{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.field textarea{min-height:80px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet footer{display:flex;gap:8px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet footer .r{display:flex;gap:8px}
.mv{display:flex;flex-direction:column;gap:2px}.mv .btn{padding:0 8px;min-height:24px;line-height:1;font-size:.7rem}.mv .btn:disabled{opacity:.25}
.hint{font-size:.82rem;color:var(--muted)}
.linklist{display:flex;flex-direction:column;gap:4px}

@media (max-width:480px){.brand .date{display:none}}
@media (max-width:760px){.sections{grid-template-columns:1fr}.phead h2{font-size:1.4rem}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><h1>Carnet de chantiers</h1><span class="date" id="today"></span><button class="btn ghost" data-act="backup" style="margin-left:auto">Réglages</button></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main id="main"></main>
<div id="sheetHost"></div>

<datalist id="dl-types"></datalist>
<datalist id="dl-lieux"></datalist>
<datalist id="dl-fourn"></datalist>
<datalist id="dl-units"><option value="pce"><option value="m"><option value="m²"><option value="m³"><option value="kg"><option value="sac"><option value="L"><option value="boîte"><option value="rouleau"><option value="lot"></datalist>

<script>
const BASE_STATUS = {devis:"Devis",planifie:"Planifié",encours:"En cours",attente:"En attente",termine:"Terminé"};
const STATUS = {...BASE_STATUS};
const DEFAULT_TYPES = ["Démolition","Maçonnerie","Plâtrerie","Électricité","Plomberie","Chauffage","Menuiserie","Carrelage","Peinture","Isolation","Toiture","Nettoyage","Administratif"];
const S = {clients:{},projects:{},tasks:{},items:{},plans:{},settings:null,planWeek:null,sending:false,calMsg:null,
  view:"taches", projectId:null, groupBy:"projet", taskFilter:"open", taskProject:"", projStatus:"actifs", error:null, local:false, loaded:false};
let db = null, pending = false;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR"}).format(n||0);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? new Date(d+"T12:00").toLocaleDateString("fr-BE",{day:"numeric",month:"short"}) : "";
const byName = (a,b) => (a||"").localeCompare(b||"","fr",{sensitivity:"base"});
const vals = o => Object.values(o);
const num = v => { const n = parseFloat(String(v??"").replace(",", ".")); return isFinite(n) ? n : 0; };

/* ---------- données (en ligne, partagées entre vos appareils) ---------- */
const COLS = ["clients","projects","tasks","items"];
async function add(col, data){
  data.createdAt = Date.now();
  if (db){ try{ await db.collection(col).add(data); }catch(e){ fail(e); } }
  else { const id = "l"+Math.random().toString(36).slice(2); S[col][id] = {id,...data}; render(); }
}
async function patch(col, id, data){
  if (db){ try{ await db.doc(col+"/"+id).update(data); }catch(e){ fail(e); } }
  else { Object.assign(S[col][id], data); render(); }
}
async function remove(col, id){
  if (db){ try{ await db.doc(col+"/"+id).delete(); }catch(e){ fail(e); } }
  else { delete S[col][id]; render(); }
}
function fail(e){
  const code = e && e.code;
  S.error = code === "quota_exceeded" ? "L'espace de stockage est plein : supprimez d'anciens projets pour en ajouter de nouveaux."
    : code === "invalid_argument" ? "Vous n'avez pas le droit de modifier ces données."
    : "L'enregistrement a échoué. Réessayez dans un instant.";
  render();
}
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const DEFAULT_UNITS = ["pce","m","m²","m³","kg","sac","L","boîte","rouleau","lot"];
const DEFAULT_SETTINGS = {workDays:[1,2,3], start:"07:00", end:"18:00", lunchStart:"", lunchEnd:"", home:"", extraDay:4, extraHours:6, types:DEFAULT_TYPES, units:DEFAULT_UNITS, suppliers:[], statusLabels:{}, extraStatuses:[], durHours:[1,4], durMaxDays:15};
const settings = () => ({...DEFAULT_SETTINGS, ...(S.settings||{})});
const hm = v => { const [h,m] = String(v||"0:0").split(":").map(Number); return (h||0) + (m||0)/60; };
function dayHours(st){ st = st || settings(); const l = Math.max(0, hm(st.lunchEnd)-hm(st.lunchStart)); return Math.max(1, hm(st.end)-hm(st.start)-l); }
const weekOrder = d => (d+6)%7;
let HPD = dayHours();
const taskHours = t => num(t.duration) * (t.durUnit==="j" ? HPD : 1);
const fmtN = n => (Math.round(n*10)/10).toLocaleString("fr-BE");
const fmtDur = t => !num(t.duration) ? "" : t.durUnit==="j" ? fmtN(num(t.duration)) + (num(t.duration)>1 ? " journées" : " journée") : fmtN(num(t.duration)) + " h";
/* Durées autorisées : 1 h, 4 h ou un nombre de journées */
let DUR_OPTS = [];
function applyLists(){
  const st = settings();
  Object.keys(STATUS).forEach(k=>delete STATUS[k]);
  Object.entries(BASE_STATUS).forEach(([k,l])=>STATUS[k] = (st.statusLabels&&st.statusLabels[k]) || l);
  (st.extraStatuses||[]).forEach(x=>{ if (x && x.k) STATUS[x.k] = x.l; });
  const hs = (st.durHours||[1,4]).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
  const nd = Math.max(1, Math.min(60, +st.durMaxDays||15));
  DUR_OPTS = hs.map(h=>["h"+h, fmtN(h)+" h"]).concat(Array.from({length:nd},(_,i)=>["j"+(i+1), (i+1)+(i?" journées":" journée")]));
}
const durKey = t => num(t.duration) ? (t.durUnit==="j"?"j":"h") + num(t.duration) : "";
function durOptions(cur){
  const opts = [["","Durée…"], ...DUR_OPTS];
  if (cur && !opts.some(o=>o[0]===cur)) opts.push([cur, fmtDur({duration:cur.slice(1), durUnit:cur[0]}) + " (à ajuster)"]);
  return opts;
}
function parseDur(v){ const m = /^([hj])([\d.]+)$/.exec(v||""); return m ? {duration:m[2], durUnit:m[1]} : {duration:"", durUnit:"h"}; }
const fmtTotal = h => h ? `${fmtN(h)} h · ${fmtN(h/HPD)} j` : "—";
const sumHours = ts => ts.reduce((s,t)=>s+taskHours(t),0);
function backupSheet(){
  const st = settings();
  const dayBoxes = [1,2,3,4,5,6,0].map(d=>`<label style="display:flex;gap:6px;align-items:center;font-weight:400;color:var(--fg);font-size:.95rem"><input type="checkbox" class="check" id="s-d${d}" name="d${d}" ${st.workDays.includes(d)?"checked":""}>${DAYS[d]}</label>`).join("");
  openSheet("Réglages",
    `<div class="field"><label>Jours de travail</label><div style="display:flex;flex-wrap:wrap;gap:8px 16px">${dayBoxes}</div></div>
     <div class="pair">${field("Début de journée","start",st.start,{type:"time"})}${field("Fin de journée","end",st.end,{type:"time"})}</div>
     ${field("Adresse de départ le matin","home",st.home,{ph:"Commune ou adresse"})}
     <p class="hint" style="margin:-6px 0 0">Le trajet jusqu'au premier chantier (ou magasin) est compté dans la journée.</p>
     <div class="pair">${field("Jour d'appoint","extraDay",String(st.extraDay??""),{type:"select",options:[["","Aucun"],...[1,2,3,4,5,6,0].map(d=>[String(d),DAYS[d]])]})}${field("Durée max (h)","extraHours",st.extraHours,{type:"number",inputmode:"decimal"})}</div>
     <p class="hint" style="margin:-6px 0 0">Utilisé seulement pour terminer un chantier en cours dont le reste tient dans cette petite journée.</p>
     <h3 style="margin:14px 0 0;font-size:1rem">Listes</h3>
     ${field("Types de tâches (un par ligne)","types",(st.types||[]).join("\n"),{type:"textarea"})}
     ${field("Unités des achats (une par ligne)","units",(st.units||[]).join("\n"),{type:"textarea"})}
     ${field("Magasins / fournisseurs favoris (un par ligne)","suppliers",(st.suppliers||[]).join("\n"),{type:"textarea",ph:"Bati-Mat, Brico…"})}
     <div class="field"><label>Noms des statuts de projet</label><div class="pair">${Object.keys(BASE_STATUS).map(k=>`<input name="sl_${k}" value="${esc(STATUS[k])}" aria-label="Statut ${BASE_STATUS[k]}">`).join("")}</div></div>
     ${field("Statuts supplémentaires (un par ligne)","extraStatuses",(st.extraStatuses||[]).map(x=>x.l).join("\n"),{type:"textarea"})}
     <div class="pair">${field("Durées courtes en heures","durHours",(st.durHours||[1,4]).join(", "),{ph:"1, 4"})}${field("Journées max","durMaxDays",st.durMaxDays||15,{type:"number",inputmode:"numeric"})}</div>

/* ---------- planning de la semaine ---------- */
function tzOffset(date, time){
  try{ const part = new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Brussels",timeZoneName:"longOffset"}).formatToParts(new Date(date+"T"+time+":00Z")).find(x=>x.type==="timeZoneName").value;
       const m = part.match(/([+-]\d{2}):?(\d{2})/); return m ? m[1]+":"+m[2] : "+01:00"; }catch(e){ return "+01:00"; }
}
const fmtDay = d => new Date(d+"T12:00").toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"short"});
const blockHours = b => Math.max(0, hm(b.end)-hm(b.start));
function blockLines(b){
  const ts = (b.taskIds||[]).map(id=>S.tasks[id]).filter(Boolean);
  const its = (b.itemIds||[]).map(id=>S.items[id]).filter(Boolean);
  return {ts, its};
}
function blockDescription(b){
  const p = proj(b.projectId), c = clientOf(p), {ts, its} = blockLines(b);
  const out = [];
  if (b.kind==="trajet") return [b.note || "", "Trajet en voiture vers : " + (b.location||""), "", "Créé depuis Carnet de chantiers"].filter((x,i)=>x||i>0).join("\n");
  if (p) out.push("Chantier : " + p.name + (c ? " (" + c.name + (c.phone ? ", " + c.phone : "") + ")" : ""));
  if (ts.length) out.push("", "Tâches :", ...ts.map(t=>"• " + t.title + (fmtDur(t) ? " (" + fmtDur(t) + ")" : "")));
  if (its.length) out.push("", "Achats :", ...its.map(i=>"• " + [i.qty, i.unit].filter(Boolean).join(" ") + " " + i.name + (i.supplier ? " — " + i.supplier : "")));
  if (b.note) out.push("", b.note);
  if (p && p.notes) out.push("", "Notes du chantier : " + p.notes);
  out.push("", "Créé depuis Carnet de chantiers");
  return out.join("\n");
}
async function planUpdate(id, data){
  if (db){ await db.doc("plans/"+id).update(data); }
  else { Object.assign(S.plans[id], data); }
}
function calError(e){
  switch (e && e.code){
    case "needs_reauth": return "Votre connexion à Google Agenda a expiré. Reconnectez Google Calendar dans les paramètres de Claude (Connecteurs), puis réessayez.";
    case "server_not_connected": case "selection_required": case "server_not_found":
      return "Google Agenda n'est pas connecté. Ajoutez Google Calendar dans les paramètres de Claude (Connecteurs), puis réessayez.";
    case "not_in_manifest": return "Vous n'avez pas autorisé cette page à utiliser Google Agenda. Rouvrez la page et acceptez la demande d'accès.";
    case "blocked_by_policy": case "approval_required": return "Votre organisation bloque l'accès à Google Agenda depuis cette page.";
    case "tool_error": return "Google Agenda a refusé un créneau : " + (e.message || "erreur inconnue") + ".";
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "Cette vue ne peut pas accéder à Google Agenda. Ouvrez la page dans Claude, connecté à votre compte.";
    default: return "Google Agenda ne répond pas. Regardez votre agenda avant de réessayer : le dernier créneau a peut-être déjà été créé.";
  }
}
async function sendPlan(id){
  const plan = S.plans[id]; if (!plan || S.sending) return;
  let mcp = null; try{ mcp = await window.claude?.use?.("mcp"); }catch(e){}
  if (!mcp){ S.calMsg = {err:true, text:calError({code:"not_granted"})}; render(); return; }
  S.sending = true; S.calMsg = null; render();
  const blocks = (plan.blocks||[]).map(b=>({...b}));
  let sent = 0, failMsg = null;
  for (const b of blocks){
    if (b.removed || b.sent) continue;
    try{
      const r = await mcp.callTool("Google Calendar","create_event",{
        summary: b.title, location: b.location || "", description: blockDescription(b),
        startTime: `${b.date}T${b.start}:00${tzOffset(b.date,b.start)}`, endTime: `${b.date}T${b.end}:00${tzOffset(b.date,b.end)}`,
        timeZone: "Europe/Brussels", useDefaultReminders: true });
      const pl = r && r.payload;
      b.sent = true; b.eventId = (pl && typeof pl === "object" && (pl.id || pl.eventId || (pl.event && pl.event.id))) || "";
      sent++;
      try{ await planUpdate(id, {blocks}); }catch(e){}
    }catch(e){ failMsg = calError(e); break; }
  }
  const allSent = blocks.every(b=>b.removed || b.sent);
  if (allSent){ try{ await planUpdate(id, {blocks, status:"envoye"}); }catch(e){} }
  S.sending = false;
  S.calMsg = failMsg ? {err:true, text: failMsg + (sent ? ` ${sent} créneau${sent>1?"x":""} ${sent>1?"ont":"a"} déjà été ajouté${sent>1?"s":""}.` : "")}
                     : {text: `${sent} créneau${sent>1?"x":""} ajouté${sent>1?"s":""} à votre Google Agenda.`};
  render();
}

function groupTasks(tasks, by){
  const g = new Map();
  const key = t => by==="type" ? (t.type||"").trim() || "Sans type"
    : by==="lieu" ? taskLoc(t) || "Sans lieu" : (proj(t.projectId)?.name || "Sans projet");
  tasks.forEach(t=>{ const k = key(t); if(!g.has(k)) g.set(k,[]); g.get(k).push(t); });
  const last = k => k.startsWith("Sans ");
  return [...g.entries()].sort((a,b)=> last(a[0])-last(b[0]) || byName(a[0],b[0]))
    .map(([k,ts])=>[k, ts.sort((a,b)=> by==="projet" ? (a.done-b.done)||byOrder(a,b) : (a.done-b.done) || (a.due||"9999").localeCompare(b.due||"9999") || byName(a.title,b.title))]);
}

      <select class="sm" id="f-proj" data-set-select="taskProject" aria-label="Filtrer par projet"><option value="">Tous les projets</option>${projOpts}</select>
    </div><button class="btn primary" data-act="new-task">+ Tâche</button></div>`;
  let ts = allTasks().filter(t=> S.taskFilter==="all" ? true : S.taskFilter==="done" ? t.done : !t.done);
  if (S.taskProject) ts = ts.filter(t=>t.projectId===S.taskProject);
  else if (S.taskFilter==="open") ts = ts.filter(t=>!proj(t.projectId) || activeProj(proj(t.projectId)));
  if (!ts.length){
    const none = !allTasks().length;
    return html + `<div class="empty"><strong>${none ? (S.loaded?"Aucune tâche pour l'instant":"Chargement de vos tâches…") : "Rien dans cette vue"}</strong>${none?"Créez un projet puis ajoutez-y des tâches, ou utilisez « + Tâche ».":"Changez le filtre pour voir les autres tâches."}</div>`;
  }
  for (const [k, list] of groupTasks(ts, S.groupBy)){
    const open = list.filter(t=>!t.done).length;
    const hl = sumHours(list.filter(t=>!t.done));
    let sub = `${open} à faire${hl?" · "+fmtN(hl)+" h":""}`;
    const pr = list.filter(t=>!t.done).reduce((x,t)=>x+(t.price||0),0);
    if (pr) sub += " · " + eur(pr);
    if (S.groupBy==="lieu"){ const ps = new Set(list.map(t=>t.projectId)); sub += ` · ${ps.size} projet${ps.size>1?"s":""}`; }
    html += `<section class="group"><h3><span>${S.groupBy==="lieu"&&!k.startsWith("Sans ")?'<span class="loc"></span>':""}${esc(k)}</span><span class="sub">${sub}</span></h3>
      <ul class="rows">${list.map(t=>taskRow(t,S.groupBy)).join("")}</ul></section>`;
  }
  return html;
}

function viewProjets(){

  const order = {encours:0,planifie:1,attente:2,devis:3,termine:4};
  const ps = vals(S.projects).filter(p=> S.projStatus==="tous" || (S.projStatus==="termine" ? p.status==="termine" : p.status!=="termine"))
    .sort((a,b)=>(order[a.status]??5)-(order[b.status]??5) || (a.start||"9999").localeCompare(b.start||"9999") || byName(a.name,b.name));
  if (!ps.length) return html + `<div class="empty"><strong>${S.loaded?"Aucun projet ici":"Chargement…"}</strong>Un projet regroupe un client, un lieu, des tâches, le matériel à acheter et l'outillage.</div>`;

function viewAchats(){
  const mat = vals(S.items).filter(i=>i.kind==="materiel" && !i.done && activeProj(proj(i.projectId)));
  const outils = vals(S.items).filter(i=>i.kind==="outil" && !i.done && activeProj(proj(i.projectId)));
  let html = `<div class="bar"><span class="hint">Tout ce qui reste à acheter et à préparer, pour les projets non terminés.</span></div>`;
  html += `<div class="sections"><div class="col"><div class="sec-h"><h3>À acheter, par fournisseur</h3><span class="hint num">${eur(mat.reduce((s,i)=>s+num(i.qty||1)*num(i.price),0))}</span></div>`;
  if (!mat.length) html += `<div class="empty"><strong>Rien à acheter</strong>Le matériel ajouté dans vos projets apparaîtra ici.</div>`;
  const g = new Map(); mat.forEach(i=>{ const k=(i.supplier||"").trim()||"Fournisseur non précisé"; if(!g.has(k)) g.set(k,[]); g.get(k).push(i); });
  [...g.entries()].sort((a,b)=>(a[0]==="Fournisseur non précisé")-(b[0]==="Fournisseur non précisé")||byName(a[0],b[0])).forEach(([k,l])=>{
    const tot = l.reduce((s,i)=>s+num(i.qty||1)*num(i.price),0);
    html += `<section class="group"><h3><span>${esc(k)}</span><span class="sub num">${eur(tot)}</span></h3><ul class="rows">${l.sort((a,b)=>byName(a.name,b.name)).map(i=>{
      const p = proj(i.projectId);
      return `<li class="row"><input type="checkbox" class="check" aria-label="Acheté" data-act="toggle" data-col="items" data-id="${i.id}">
        <span class="qtycol">${esc(i.qty||"")} ${esc(i.unit||"")}</span>
        <div class="body"><button class="title" data-act="edit-item" data-id="${i.id}">${esc(i.name)}</button><div class="meta"><button class="chip link" data-open-project="${p.id}">${esc(p.name)}</button></div></div>
        <span class="price">${i.price?eur(num(i.qty||1)*num(i.price)):""}</span></li>`;}).join("")}</ul></section>`;
  });
  html += `</div><div class="col"><div class="sec-h"><h3>Outillage à préparer</h3><span class="hint num">${outils.length}</span></div>`;
  if (!outils.length) html += `<div class="empty"><strong>Tout est prêt</strong>Les outils non cochés de vos projets apparaîtront ici.</div>`;
  const go = new Map(); outils.forEach(i=>{ if(!go.has(i.projectId)) go.set(i.projectId,[]); go.get(i.projectId).push(i); });
  [...go.entries()].sort((a,b)=>byName(proj(a[0]).name,proj(b[0]).name)).forEach(([pid,l])=>{
    const p = proj(pid);
    html += `<section class="group"><h3><button class="title" data-open-project="${pid}" style="font:inherit;background:none;border:0;padding:0;cursor:pointer">${esc(p.name)}</button><span class="sub">${p.location?'<span class="loc"></span>'+esc(p.location):""}</span></h3><ul class="rows">${l.sort((a,b)=>byName(a.name,b.name)).map(itemRow).join("")}</ul></section>`;
  });
  return html + `</div></div>`;
}

/* ---------- panneau d'édition ---------- */
let sheetSubmit = null, sheetDelete = null;
function field(label, name, value, opts={}){
  const id = "s-"+name;
  if (opts.type==="select") return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${name}">${opts.options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value??"")?"selected":""}>${esc(l)}</option>`).join("")}</select></div>`;
  if (opts.type==="textarea") return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${name}" placeholder="${esc(opts.ph||"")}">${esc(value)}</textarea></div>`;
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${name}" type="${opts.type||"text"}" value="${esc(value)}" ${opts.list?`list="${opts.list}"`:""} ${opts.required?"required":""} ${opts.inputmode?`inputmode="${opts.inputmode}"`:""} placeholder="${esc(opts.ph||"")}"></div>`;
}
function openSheet(title, body, onSubmit, onDelete, extra=""){
  sheetSubmit = onSubmit; sheetDelete = onDelete;
  $("#sheetHost").innerHTML = `<div class="scrim" data-sheet="close"></div>
    <aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <header><h2>${esc(title)}</h2><button class="btn ghost" data-sheet="close" aria-label="Fermer">✕</button></header>
      <form id="sheetForm">${body}${extra}</form>
      <footer>${onDelete?`<button class="btn danger" data-sheet="delete" type="button">Supprimer</button>`:"<span></span>"}
        <div class="r"><button class="btn" data-sheet="close" type="button">Annuler</button><button class="btn primary" type="submit" form="sheetForm">Enregistrer</button></div></footer>
    </aside>`;
  setTimeout(()=>{ const f = $("#sheetForm input, #sheetForm select"); f && f.focus(); }, 30);
}
function closeSheet(){ $("#sheetHost").innerHTML = ""; sheetSubmit = sheetDelete = null; if (pending) render(); }

const projectOptions = (cur) => [["","— Aucun —"], ...vals(S.projects).filter(p=>activeProj(p)||p.id===cur).sort((a,b)=>byName(a.name,b.name)).map(p=>[p.id,p.name])];
const clientOptions = () => [["","— Aucun —"], ...vals(S.clients).sort((a,b)=>byName(a.name,b.name)).map(c=>[c.id,c.name])];

function taskSheet(t, defaults={}){
  t = t || {projectId: defaults.projectId || S.taskProject || (S.view==="projet"?S.projectId:""), done:false};
  const p = proj(t.projectId);
  openSheet(t.id?"Modifier la tâche":"Nouvelle tâche",

    field("Durée estimée","dur",durKey(t),{type:"select",options:durOptions(durKey(t))}) +
    field("Lieu","location",t.location,{list:"dl-lieux",ph:p?.location?`Par défaut : ${p.location}`:"Adresse, commune, pièce…"}) +
    `<p class="hint" style="margin:-6px 0 0">Laissez vide pour utiliser le lieu du projet.</p>` +
    field("Notes","notes",t.notes,{type:"textarea"}) +

         t.id ? patch("tasks",t.id,d) : add("tasks",d); },
    t.id ? ()=>remove("tasks",t.id) : null);
}
async function createClient(data){
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const doc = {...data, createdAt: Date.now()};
  if (db){ try{ await db.doc("clients/"+id).set(doc); }catch(e){ fail(e); return ""; } }
  else { S.clients[id] = {id, ...doc}; }
  return id;
}
function projectSheet(p){
  p = p || {status:"devis"};
  const tsCount = p.id ? vals(S.tasks).filter(t=>t.projectId===p.id).length + vals(S.items).filter(i=>i.projectId===p.id).length : 0;
  openSheet(p.id?"Modifier le projet":"Nouveau projet",
    field("Nom du projet","name",p.name,{required:true,ph:"Ex. Rénovation salle de bain"}) +
    field("Client","clientId", p.clientId || (vals(S.clients).length ? "" : "__new"), {type:"select",options:[...clientOptions(), ["__new","+ Nouveau client…"]]}) +
    `<div id="newClientBox" class="newclient" ${(p.clientId || vals(S.clients).length) ? "hidden" : ""}>
       ${field("Nom du nouveau client","ncName","",{ph:"Nom ou société"})}
       <div class="pair">${field("Téléphone","ncPhone","",{type:"tel"})}${field("E-mail","ncEmail","",{type:"email"})}</div>
       ${field("Adresse","ncAddress","",{ph:"Rue, code postal, commune"})}
       <p class="hint" style="margin:0">Le client sera créé en même temps que le projet. Si le lieu du chantier est vide, son adresse sera utilisée.</p>
     </div>` +
    field("Lieu du chantier","location",p.location,{list:"dl-lieux",ph:"Rue, commune"}) +
    field("Statut","status",p.status,{type:"select",options:Object.entries(STATUS)}) +
    `<div class="pair">${field("Début","start",p.start,{type:"date"})}${field("Fin prévue","end",p.end,{type:"date"})}</div>` +
    field("Notes","notes",p.notes,{type:"textarea",ph:"Accès, code porte, remarques du client…"}),
    async f=>{ let clientId = f.clientId, location = f.location.trim();
         if (clientId === "__new"){
           const nm = (f.ncName||"").trim();
           clientId = nm ? await createClient({name:nm, phone:(f.ncPhone||"").trim(), email:(f.ncEmail||"").trim(), address:(f.ncAddress||"").trim(), notes:""}) : "";
           if (!location) location = (f.ncAddress||"").trim();
         }
         const d={name:f.name.trim(),clientId,location,status:f.status,start:f.start,end:f.end,notes:f.notes.trim()};
         p.id ? patch("projects",p.id,d) : add("projects",d); },
    p.id ? async ()=>{ for (const t of vals(S.tasks).filter(t=>t.projectId===p.id)) await remove("tasks",t.id);
                       for (const i of vals(S.items).filter(i=>i.projectId===p.id)) await remove("items",i.id);
                       await remove("projects",p.id); if (S.projectId===p.id) go("projets"); } : null,
    p.id && tsCount ? `<p class="hint">Supprimer ce projet supprime aussi ses ${tsCount} tâches et articles.</p>` : "");
}
function clientSheet(c){

}

    `<div class="pair">${field("Fournisseur","supplier",i.supplier,{list:"dl-fourn"})}${field("Prix unitaire (€)","price",i.price,{inputmode:"decimal"})}</div>` +
    field("Projet","projectId",i.projectId,{type:"select",options:projectOptions(i.projectId).slice(1)}) +
    field("Notes","notes",i.notes,{type:"textarea"}) +
    field("Statut","done",i.done?"1":"",{type:"select",options:mat?[["","À acheter"],["1","Acheté"]]:[["","À préparer"],["1","Prêt"]]}),
    f=>patch("items",i.id,{kind:f.kind,name:f.name.trim(),qty:f.qty.trim(),unit:f.unit.trim(),supplier:f.supplier.trim(),price:f.price.trim()?num(f.price):"",projectId:f.projectId,notes:f.notes.trim(),done:!!f.done}),
    ()=>remove("items",i.id));
}

/* ---------- navigation & événements ---------- */
function go(view, projectId){
  S.view = view; S.projectId = projectId || null;
  try{ history.replaceState(null,"", "#"+(view==="projet"?"projet-"+projectId:view)); }catch(e){}
  render(); window.scrollTo(0,0);
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-nav],[data-open-project],[data-act],[data-set],[data-sheet]");
  if (!t) return;
  if (t.dataset.sheet==="close") return closeSheet();
  if (t.dataset.sheet==="delete"){
    if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent="Confirmer la suppression"; return; }
    const fn = sheetDelete; closeSheet(); fn && fn(); return;
  }
  if (t.dataset.nav) return go(t.dataset.nav);
  if (t.dataset.openProject){ e.stopPropagation(); return go("projet", t.dataset.openProject); }
  if (t.dataset.set){ S[t.dataset.set] = t.dataset.val; return render(); }
  const id = t.dataset.id;
  switch (t.dataset.act){
    case "toggle": { const col=t.dataset.col; patch(col,id,{done:t.checked}); break; }
    case "move-up": moveTask(id,-1); break;
    case "move-down": moveTask(id,1); break;
    case "edit-task": taskSheet(S.tasks[id]); break;
    case "new-task": taskSheet(null); break;
    case "edit-item": itemSheet(S.items[id]); break;
    case "new-project": projectSheet(null); break;
    case "edit-project": projectSheet(S.projects[id]); break;
    case "new-client": clientSheet(null); break;
    case "edit-client": clientSheet(S.clients[id]); break;
    case "backup": backupSheet(); break;
    case "plan-send": sendPlan(id); break;
    case "plan-toggle": togglePlanBlock(id, +t.dataset.i); break;
    case "plan-week": if (t.dataset.val){ S.planWeek = t.dataset.val; S.calMsg = null; render(); } break;
    case "cal-dismiss": S.calMsg = null; render(); break;
    case "dismiss": S.error=null; render(); break;
    case "clear-examples": (async()=>{ for (const c of COLS) for (const d of vals(S[c]).filter(d=>d.example)) await remove(c,d.id); })(); break;
  }
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape" && sheetSubmit) closeSheet();
  if ((e.key==="Enter"||e.key===" ") && e.target.matches(".card[data-act]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e=>{
  if (e.target.id==="s-clientId"){ const box=$("#newClientBox"); if (box){ box.hidden = e.target.value!=="__new"; if(!box.hidden){ const n=$("#s-ncName"); n&&n.focus(); } } }
  if (e.target.dataset.setSelect){ S[e.target.dataset.setSelect] = e.target.value; render(); }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  const f = e.target;
  if (f.id==="sheetForm"){ const d = Object.fromEntries(new FormData(f)); const fn = sheetSubmit; closeSheet(); fn && fn(d); return; }
  const q = f.dataset.quick; if (!q) return;
  const d = Object.fromEntries(new FormData(f)), pid = f.dataset.project;
  const focusId = (f.querySelector(q==="materiel"?"[name=qty]":"input")||{}).id;
  f.reset();
  const done = q==="task"
    ? add("tasks",{title:d.title.trim(),type:d.type.trim(),location:d.location.trim(),...parseDur(d.dur),projectId:pid,done:false,due:"",notes:""})
    : add("items",{kind:q,name:d.name.trim(),qty:(d.qty||"").trim(),unit:(d.unit||"").trim(),supplier:(d.supplier||"").trim(),price:d.price?num(d.price):"",projectId:pid,done:false,notes:""});
  const refocus = ()=>{ render(); const el = focusId && document.getElementById(focusId); el && el.focus(); };
  refocus(); Promise.resolve(done).then(()=>setTimeout(refocus,60));
});
$("#main").addEventListener("focusout", ()=>setTimeout(()=>{ if (pending && !typing()) render(); }, 0));

/* ---------- démarrage ---------- */
$("#today").textContent = new Date().toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long"});
(function(){ const h = (location.hash||"").slice(1);
  if (h.startsWith("projet-")){ S.view="projet"; S.projectId=h.slice(7); }
  else if (["planning","taches","projets","clients","achats"].includes(h)) S.view=h; })();
render();

(async ()=>{
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){ S.loaded = true; S.error = "Cette vue ne peut pas enregistrer : vos saisies seront perdues à la fermeture."; render(); return; }
  const got = new Set();
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const next = {}; snap.docs.forEach(d=>{ next[d.id] = {id:d.id, ...d.data()}; });
      S[c] = next; got.add(c); if (got.size===COLS.length) S.loaded = true;
      scheduleRender();
    }, err=>{ S.error = "La connexion aux données est interrompue. Rechargez la page."; render(); });
  });
  db.collection("plans").onSnapshot(snap=>{
    const next = {}; snap.docs.forEach(d=>{ next[d.id] = {id:d.id, ...d.data()}; });
    S.plans = next; scheduleRender();
  }, ()=>{});
  db.doc("settings/main").onSnapshot(d=>{ S.settings = d.exists ? d.data() : null; scheduleRender(); }, ()=>{});
})();
